<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Language Translation Tool</h1>
            <p>Translate text quickly and easily between different languages.</p>
        </header>

        <main class="translator-box">

            <!-- Language Selection -->
            <div class="language-selection">

                <div class="language-group">
                    <label for="sourceLanguage">Source Language</label>

                    <select id="sourceLanguage">
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

                <button
                    type="button"
                    id="swapButton"
                    class="swap-button"
                    title="Swap Languages">
                    ⇄
                </button>

                <div class="language-group">
                    <label for="targetLanguage">Target Language</label>

                    <select id="targetLanguage">
                        <option value="hi" selected>Hindi</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

            </div>

            <!-- Text Areas -->
            <div class="text-area-container">

                <div class="text-section">
                    <label for="inputText">Enter Text</label>

                    <textarea
                        id="inputText"
                        placeholder="Type or paste the text you want to translate..."
                        maxlength="5000"></textarea>

                    <div class="character-count">
                        <span id="characterCount">0</span> / 5000 characters
                    </div>
                </div>

                <div class="text-section">
                    <label for="translatedText">Translated Text</label>

                    <textarea
                        id="translatedText"
                        placeholder="Your translated text will appear here..."
                        readonly></textarea>

                    <div class="result-buttons">

                        <button
                            type="button"
                            id="copyButton"
                            class="secondary-button">
                            Copy
                        </button>

                        <button
                            type="button"
                            id="speakButton"
                            class="secondary-button">
                            🔊 Speak
                        </button>

                    </div>

                </div>

            </div>

            <!-- Translate Button -->
            <button
                type="button"
                id="translateButton"
                class="translate-button">
                Translate
            </button>

            <p
                id="statusMessage"
                class="status-message">
            </p>

        </main>

        <footer>
            <p>Language Translation Tool | AI Internship Project</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
